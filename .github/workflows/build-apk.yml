name: Compila APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica progetto
        uses: actions/checkout@v4
      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Mantieni firma stabile
        uses: actions/cache@v4
        with:
          path: app/trisassist-debug.keystore
          key: tris-assist-debug-signing-v3
      - name: Crea firma se assente
        run: |
          if [ ! -f app/trisassist-debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/trisassist-debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Tris Assist,O=Tris Assist,C=IT"
          fi
      - name: Compila APK debug
        run: gradle --no-daemon assembleDebug
      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: TrisAssist-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
